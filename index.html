<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseStream Analytics - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center border-b border-gray-800 pb-6 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-indigo-400">PulseStream Analytics</h1>
                <p class="text-gray-400 text-sm">Monitoramento de Streaming em Tempo Real</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm font-medium text-gray-300">Conectado à API</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider">Último Dispositivo</h3>
                <p id="card-device" class="text-2xl font-bold mt-2 text-white">Aguardando...</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider">Taxa de Bits (Bitrate)</h3>
                <p id="card-bitrate" class="text-2xl font-bold mt-2 text-indigo-400">0 kbps</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider">Status do Sistema</h3>
                <span id="card-status" class="inline-block px-3 py-1 rounded-full text-sm font-semibold mt-3 bg-gray-700 text-gray-300">
                    Desconectado
                </span>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-gray-200">Histórico de Oscilação de Bitrate</h2>
            <div class="relative h-96 w-full">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('analyticsChart').getContext('2d');
        
        // Configuração Inicial do Gráfico do Chart.js
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Armazenará os timestamps
                datasets: [{
                    label: 'Bitrate (kbps)',
                    data: [], // Valores vindos da API
                    borderColor: '#818cf8',
                    backgroundColor: 'rgba(129, 140, 248, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' }, beginAtZero: true }
                },
                plugins: {
                    legend: { labels: { color: '#f3f4f6' } }
                }
            }
        });

        // Função que busca os dados do backend
        async function atualizarDashboard() {
            try {
                const response = await fetch('http://localhost:3000/api/metrics');
                if (!response.ok) throw new Error('Erro ao buscar dados da API');
                
                const metrics = await response.json();
                
                if (metrics.length === 0) return;

                // Inverte o array para mostrar o mais antigo primeiro no gráfico (esquerda para a direita)
                const dadosOrdenados = metrics.reverse();

                // Extrai as informações necessárias
                const labels = dadosOrdenados.map(m => new Date(m.timestamp).toLocaleTimeString());
                const bitrates = dadosOrdenados.map(m => m.bitrate);
                
                // Pega a métrica mais recente para os Cards informativos
                const ultimaMetrica = dadosOrdenados[dadosOrdenados.length - 1];

                // Atualiza os Cards
                document.getElementById('card-device').innerText = ultimaMetrica.deviceId;
                document.getElementById('card-bitrate').innerText = `${ultimaMetrica.bitrate} kbps`;
                
                const statusCard = document.getElementById('card-status');
                statusCard.innerText = ultimaMetrica.status.toUpperCase();
                
                // Altera as cores do card de status dinamicamente
                if (ultimaMetrica.status === 'stable') {
                    statusCard.className = "inline-block px-3 py-1 rounded-full text-sm font-semibold mt-3 bg-green-900/50 text-green-400 border border-green-700";
                } else if (ultimaMetrica.status === 'warning') {
                    statusCard.className = "inline-block px-3 py-1 rounded-full text-sm font-semibold mt-3 bg-yellow-900/50 text-yellow-400 border border-yellow-700";
                } else {
                    statusCard.className = "inline-block px-3 py-1 rounded-full text-sm font-semibold mt-3 bg-red-900/50 text-red-400 border border-red-700 animate-pulse";
                }

                // Atualiza o Gráfico na tela
                chart.data.labels = labels;
                chart.data.datasets[0].data = bitrates;
                chart.update();

            } catch (error) {
                console.error('Erro no Dashboard:', error);
            }
        }

        // Fica puxando atualizações a cada 3 segundos
        setInterval(atualizarDashboard, 3000);
        // Roda uma vez ao carregar a página
        atualizarDashboard();
    </script>
</body>
</html>
