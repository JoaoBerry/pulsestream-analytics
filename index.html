<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseStream Analytics - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">⚡ PulseStream Analytics</h1>
            <p class="text-slate-400">Monitoramento de cliques em tempo real</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Total de Cliques</h3>
                <p id="total-cliques" class="text-5xl font-extrabold text-cyan-400 mt-2">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Status do Sistema</h3>
                    <p id="status" class="text-lg font-medium text-green-400 mt-2">● Conectado ao Fluxo</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-slate-300">Cliques por Categoria</h2>
            <div class="relative h-80">
                <canvas id="graficoCategorias"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. Configuração Inicial do Gráfico do Chart.js
        const ctx = document.getElementById('graficoCategorias').getContext('2d');
        const meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Eletrônicos', 'Roupas', 'Livros', 'Casa'],
                datasets: [{
                    label: 'Quantidade de Cliques',
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#22d3ee', '#a78bfa', '#f472b6', '#fbbf24'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // 2. Conexão em Tempo Real com o Backend (A Mágica acontece aqui)
        const eventSource = new EventSource('http://localhost:3000/live-metrics');

        eventSource.onmessage = function(event) {
            // Converte o texto JSON que veio do servidor de volta para um objeto Javascript
            const dados = JSON.parse(event.data);
            
            // Atualiza o card com o total de cliques
            document.getElementById('total-cliques').innerText = dados.totalCliques;

            // Mapeia os dados recebidos para as posições corretas do gráfico
            const novosValores = [
                dados.porCategoria['Eletrônicos'] || 0,
                dados.porCategoria['Roupas'] || 0,
                dados.porCategoria['Livros'] || 0,
                dados.porCategoria['Casa'] || 0
            ];

            // Alimenta o gráfico com os novos valores e força ele a se redesenhar
            meuGrafico.data.datasets[0].data = novosValores;
            meuGrafico.update();
        };

        // Se o servidor cair, avisa na tela
        eventSource.onerror = function() {
            document.getElementById('status').innerText = '❌ Desconectado';
            document.getElementById('status').className = 'text-lg font-medium text-red-400 mt-2';
        };
    </script>
</body>
</html>
